networks:
  net1:
    ipam:
      config:
        - subnet: 10.0.1.0/24
  net2:
    ipam:
      config:
        - subnet: 10.0.2.0/24
  net3:
    ipam:
      config:
        - subnet: 10.0.3.0/24
  net4:
    ipam:
      config:
        - subnet: 10.0.4.0/24
  net5:
    ipam:
      config:
        - subnet: 10.0.5.0/24
  net6:
    ipam:
      config:
        - subnet: 10.0.6.0/24

services:
  R1:
    build: .
    image: custom-frr
    container_name: R1
    hostname: R1
    privileged: true
    tty: true
    sysctls:
      net.ipv4.ip_forward: 1
    volumes:
      - ./config/daemons:/etc/frr/daemons
    networks:
      net1:
        ipv4_address: 10.0.1.10
      net2:
        ipv4_address: 10.0.2.10

  R2:
    build: .
    image: custom-frr
    container_name: R2
    hostname: R2
    privileged: true
    tty: true
    sysctls:
      net.ipv4.ip_forward: 1
    volumes:
      - ./config/daemons:/etc/frr/daemons
    networks:
      net1:
        ipv4_address: 10.0.1.20
      net3:
        ipv4_address: 10.0.3.20
      net6:
        ipv4_address: 10.0.6.20

  R3:
    build: .
    image: custom-frr
    container_name: R3
    hostname: R3
    privileged: true
    tty: true
    sysctls:
      net.ipv4.ip_forward: 1
    volumes:
      - ./config/daemons:/etc/frr/daemons
    networks:
      net2:
        ipv4_address: 10.0.2.30
      net4:
        ipv4_address: 10.0.4.30

  R4:
    build: .
    image: custom-frr
    container_name: R4
    hostname: R4
    privileged: true
    tty: true
    sysctls:
      net.ipv4.ip_forward: 1
    volumes:
      - ./config/daemons:/etc/frr/daemons
    networks:
      net3:
        ipv4_address: 10.0.3.40
      net4:
        ipv4_address: 10.0.4.40
      net5:
        ipv4_address: 10.0.5.40

  R5:
    build: .
    image: custom-frr
    container_name: R5
    hostname: R5
    privileged: true
    tty: true
    sysctls:
      net.ipv4.ip_forward: 1
    volumes:
      - ./config/daemons:/etc/frr/daemons
    networks:
      net5:
        ipv4_address: 10.0.5.50
      net6:
        ipv4_address: 10.0.6.50
